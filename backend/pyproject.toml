[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-marker"
version = "0.1.0"
description = "Local-first AI-assisted coursework marker skeleton"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "greenlet==3.0.3; python_version < '3.10'",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "fastembed==0.3.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
  "types-jsonschema>=4.23,<5"
]
ml = []
# scripts/import_real_submissions.py: re-renders anonymised text as PDF
import = ["reportlab>=4,<6"]
# eval/run.py: tokenizer for dry-run metering, charts
eval = ["tiktoken>=0.7,<1", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests/architecture"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["app.domain", "app.llm.json_io"]

