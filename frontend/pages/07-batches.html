<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marking batches — AI-assisted marker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* USyd layered palette */
    --paper:#F3EEE8;        /* page background (warm sand) */
    --surface:#FFFFFF;      /* cards */
    --tint:#FAF6F1;         /* inner panels */
    --ink:#424242;          /* body + headings (USyd charcoal) */
    --ink-soft:#6E655E;
    --border:#E2D8CE;
    --primary:#E64626;      /* USyd master-brand ochre/red */
    --primary-soft:#FBE4DB;
    --chrome:#424242;       /* top bar */
    --on-chrome:#FFFFFF;
    --on-chrome-soft:#BDBDBD;
    --track:#E9E2DA;
    --hover:#ECE4DB;
    --info:#007DC1; --info-bg:#DFF4FF;
    --ai:#8F3F24; --ai-bg:#F6E7DC; --ai-ink:#4E3B31;
    --risk:#C8102E; --risk-bg:#FBE5E8;
    --conf-high:#2F7A45; --conf-high-bg:#E3F1E5;
    --conf-med:#7A5A00;  --conf-med-dot:#F2A900; --conf-med-bg:#FFF3CC;
    --conf-low:#C8102E;  --conf-low-bg:#FBE5E8;
    --conf-none:#7A746E; --conf-none-bg:#EFEAE5;
    --border-strong:#CFC3B7;
    --lv1:#8F3F24; --lv2:#B85A35; --lv3:#D9895F; --lv4:#EDB999; --lv5:#F6E7DC;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; line-height:1.5; }
  main{ max-width:1100px; margin:0 auto; padding:36px 40px 80px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  h1{ font-family:'Source Serif 4',serif; font-weight:600; font-size:28px; margin:0 0 4px; }
  .sub{ margin:0; color:var(--ink-soft); font-size:14px; }
  .btn{ display:inline-flex; align-items:center; height:38px; padding:0 16px; border-radius:7px; font:500 13.5px 'Inter',sans-serif; text-decoration:none; white-space:nowrap; }
  .btn-primary{ background:var(--primary); color:#fff; } .btn-primary:hover{ opacity:.9; }
  .tools{ display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .search{ display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ink-soft); width:320px; max-width:100%; }
  .search input{ border:0; outline:0; font:14px 'Inter',sans-serif; color:var(--ink); background:transparent; width:100%; }
  .search:focus-within{ border-color:var(--primary); }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ font:12.5px 'Inter',sans-serif; padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .chip span{ font-family:'IBM Plex Mono',monospace; margin-left:2px; }
  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .group{ margin-bottom:26px; }
  .group h2{ font-family:'Source Serif 4',serif; font-weight:600; font-size:18px; margin:0 0 10px; display:flex; align-items:baseline; gap:10px; }
  .group h2 small{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:400; color:var(--ink-soft); }
  .list{ background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .lhead, .brow{ display:grid; grid-template-columns:minmax(0,2fr) 116px minmax(0,1.1fr) minmax(0,1fr) 126px; gap:20px; align-items:center; padding:0 22px; }
  .lhead{ height:40px; background:var(--tint); border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:500; }
  .brow{ min-height:76px; padding-top:14px; padding-bottom:14px; border-bottom:1px solid var(--border); color:var(--ink); text-decoration:none; transition:background .1s; }
  .brow:last-child{ border-bottom:0; }
  .brow:hover{ background:var(--tint); }
  .brow:hover .b-name{ color:var(--primary); }
  .brow:hover .b-go{ color:var(--primary); transform:translateX(2px); }
  .brow[data-href]{ cursor:pointer; }
  .b-name{ font-family:'Source Serif 4',serif; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .on-home{ font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--border-strong); border-radius:4px; padding:1px 6px; }
  .b-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:20px; font-weight:500; white-space:nowrap; }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.processing{ background:var(--ai-bg); color:var(--ai); }
  .pill.processing .dot{ animation:pulse 1.4s ease-in-out infinite; }
  .pill.reviewing{ background:var(--info-bg); color:var(--info); }
  .pill.done{ background:var(--track); color:var(--ink-soft); }
  .pill.draft{ background:transparent; color:var(--ink-soft); border:1px dashed var(--border-strong); }
  .pill.cancelled{ background:var(--risk-bg); color:var(--risk); }
  @keyframes pulse{ 50%{ opacity:.25; } }
  .bar{ height:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  .bar span{ display:block; height:100%; border-radius:3px; }
  .b-ptxt{ font-size:12px; color:var(--ink-soft); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rub-link{ font-size:13px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px; cursor:pointer; }
  .rub-link:hover{ color:var(--primary); text-decoration-color:var(--primary); }
  .b-go{ color:var(--ink-soft); font-size:16px; transition:transform .15s, color .15s; }
  .batch-actions{ display:flex; justify-content:flex-end; gap:6px; }
  .row-action{ border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); color:var(--ink-soft); padding:6px 9px; font:500 12px 'Inter',sans-serif; cursor:pointer; }
  .row-action:hover{ border-color:var(--risk); color:var(--risk); background:var(--risk-bg); }
  .row-action:disabled{ opacity:.55; cursor:wait; }
  .empty{ text-align:center; color:var(--ink-soft); padding:30px 0; }
  @media (max-width:900px){
    main{ padding:24px 16px 60px; }
    .search{ width:100%; }
    .lhead{ display:none; }
    .brow{ grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; padding:14px 16px; }
    .b-main{ grid-column:1 / 2; } .b-st{ grid-column:2; grid-row:1; align-self:start; }
    .b-prog, .b-rub{ grid-column:1 / -1; }
    .b-go{ display:none; }
    .b-meta{ white-space:normal; }
  }

  /* ===== Shared top bar (logo · AI-assisted marker · Prototype · user) ===== */
  header.app-bar{ flex-wrap:nowrap; display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:20px; height:68px; min-height:68px; padding:0 28px; background:var(--chrome); }
  .ab-left{ display:flex; align-items:center; gap:16px; min-width:0; flex:1 1 auto; }
  .ab-right{ display:flex; align-items:center; gap:18px; flex:none; }
  .ab-back{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:7px; border:1px solid rgba(255,255,255,.2); color:var(--on-chrome-soft); text-decoration:none; font-family:'Inter',sans-serif; font-size:13px; white-space:nowrap; flex:none; }
  .ab-back:hover{ color:var(--on-chrome); border-color:rgba(255,255,255,.45); }
  .ab-brand{ display:flex; align-items:center; gap:12px; text-decoration:none; flex:none; }
  .ab-brand img{ height:46px; width:auto; display:block; }
  .ab-div{ width:1px; height:26px; background:rgba(255,255,255,.28); }
  .ab-name{ font-family:'Source Serif 4',serif; font-weight:600; font-size:16px; color:var(--on-chrome); white-space:nowrap; }
  .ab-proto{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:#F4A68F; border:1px solid rgba(230,70,38,.75); border-radius:4px; padding:2px 6px; white-space:nowrap; cursor:help; }
  .ab-meta{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--on-chrome-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .ab-nav{ display:flex; gap:4px; }
  .ab-nav a{ padding:7px 11px; border-radius:7px; color:var(--on-chrome-soft); text-decoration:none; font-family:'Inter',sans-serif; font-size:13.5px; white-space:nowrap; }
  .ab-nav a:hover{ color:var(--on-chrome); background:rgba(255,255,255,.06); }
  .ab-nav a.current{ color:var(--on-chrome); background:rgba(255,255,255,.12); font-weight:500; }
  .ab-actions{ display:flex; align-items:center; gap:16px; }
  .ab-user{ display:flex; align-items:center; gap:10px; padding-left:18px; border-left:1px solid rgba(255,255,255,.16); font-family:'Inter',sans-serif; }
  .ab-uname{ font-size:13px; color:var(--on-chrome); white-space:nowrap; }
  .ab-role{ padding:3px 9px; border-radius:6px; border:1px solid rgba(255,255,255,.22); font-size:12px; color:var(--on-chrome-soft); }
  .ab-avatar{ width:32px; height:32px; border-radius:50%; background:#9A8F86; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex:none; }
  /* Step tracker sits in a light strip under the bar */
  .ab-steps{ background:var(--surface); border-bottom:1px solid var(--border); }
  .ab-steps-in{ max-width:1180px; margin:0 auto; padding:10px 40px; }
  .ab-steps .step-track, .ab-steps .steps{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft) !important; }
  .ab-steps .step-track *, .ab-steps .steps *{ color:var(--ink-soft); }
  .ab-steps .current{ color:var(--primary) !important; font-weight:500; border-bottom:2px solid var(--primary); padding-bottom:1px; }
  .ab-steps .done, .ab-steps .ok{ color:var(--conf-high) !important; }
  .ab-steps .done::before{ color:var(--conf-high) !important; }
  @media (max-width:1250px){ .ab-meta{ display:none; } }
  @media (max-width:1080px){ .ab-uname{ display:none; } }
  @media (max-width:900px){
    header.app-bar{ height:60px; min-height:60px; padding:0 14px; gap:10px; flex-direction:row; align-items:center; }
    .ab-left{ gap:10px; }
    .ab-name, .ab-div, .ab-role, .ab-nav, .ab-meta{ display:none; }
    .ab-brand img{ height:38px; }
    .ab-back{ padding:6px 9px; }
    .ab-back .lbl{ display:none; }
    .ab-user{ padding-left:10px; }
    .ab-actions.hide-sm{ display:none; }
    .ab-steps-in{ padding:8px 16px; }
  }
  @media (max-width:420px){ .ab-brand img{ height:34px; } .ab-proto{ font-size:9.5px; padding:1px 4px; } }

  /* Breadcrumb after the Prototype tag — logo + name never move between pages */
  .ab-crumbs{ display:flex; align-items:center; gap:0; min-width:0; font-family:'Inter',sans-serif; font-size:13.5px; padding-left:16px; border-left:1px solid rgba(255,255,255,.18); height:26px; }
  .ab-crumbs ol{ display:flex; align-items:center; list-style:none; margin:0; padding:0; min-width:0; }
  .ab-crumbs li{ display:flex; align-items:center; min-width:0; white-space:nowrap; }
  .ab-crumbs li + li::before{ content:""; width:6px; height:6px; margin:0 11px 0 9px; border-right:1.5px solid rgba(255,255,255,.35); border-top:1.5px solid rgba(255,255,255,.35); transform:rotate(45deg); flex:none; }
  .ab-crumbs a{ color:var(--on-chrome-soft); text-decoration:none; padding:4px 6px; margin:0 -6px; border-radius:6px; }
  .ab-crumbs a:hover{ color:var(--on-chrome); background:rgba(255,255,255,.08); }
  .ab-crumbs [aria-current]{ color:var(--on-chrome); font-weight:500; overflow:hidden; text-overflow:ellipsis; }
  .ab-crumbs .bc-up{ display:none; }
  @media (max-width:1250px){ .ab-crumbs li.bc-home{ display:none; } .ab-crumbs li.bc-home + li::before{ display:none; } }
  @media (max-width:900px){
    .ab-crumbs{ padding-left:10px; font-size:13px; }
    .ab-crumbs ol{ display:none; }
    .ab-crumbs .bc-up{ display:inline-flex; align-items:center; gap:6px; color:var(--on-chrome-soft); text-decoration:none; white-space:nowrap; max-width:40vw; min-width:0; }
  }
  .ab-crumbs .bc-up .t{ overflow:hidden; text-overflow:ellipsis; }
  @media print{ header.app-bar, .ab-steps{ display:none; } }
</style>
</head>

<main>
  <div class="page-head">
    <div>
      <h1>Marking batches</h1>
      <p class="sub">Every batch you mark or have marked. Active batches also appear on Home.</p>
    </div>
    <a class="btn btn-primary" href="01-upload.html">New marking batch →</a>
  </div>

  <div class="tools">
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search batches" aria-label="Search batches"></label>
    <div class="filters">
      <button class="chip active" data-f="all" type="button">All <span></span></button>
      <button class="chip" data-f="active" type="button">Active <span></span></button>
      <button class="chip" data-f="draft" type="button">Draft <span></span></button>
      <button class="chip" data-f="complete" type="button">Complete <span></span></button>
      <button class="chip" data-f="cancelled" type="button">Cancelled <span></span></button>
    </div>
  </div>

  <div id="groups"></div>
  <p class="empty" id="empty" hidden>No batches match your search.</p>
</main>

<script>
(function(){
  var B = [
    { name:'ASGN2 — Critical Essay', term:'2026 S2', st:'processing', n:'1,247 submissions', crit:4, rubric:['Critical Essay — HD/D/C/P','critical-essay'], date:'due 24 Oct', prog:[67,'836 / 1,247 processed','var(--primary)'], href:'02-batch-status.html', home:true },
    { name:'ASGN1 — Literature Review', term:'2026 S2', st:'review', n:'340 submissions', crit:5, rubric:['Literature Review','literature-review'], date:'due 18 Oct', prog:[92,'312 / 340 confirmed','var(--info)'], href:'02-batch-status.html#asgn1', home:true },
    { name:'Quiz 3 — Short Answers', term:'2026 S2', st:'complete', n:'1,198 submissions', crit:3, rubric:['Short Answer (quiz)','short-answer'], date:'closed 9 Oct', prog:[100,'released to Canvas','var(--ink-soft)'], href:'04-batch-complete.html', home:true },
    { name:'ASGN3 — Final Project Report', term:'2026 S2', st:'draft', n:'no submissions yet', crit:6, rubric:['Final Project Report','final-project-report'], date:'due 14 Nov', prog:[0,'rubric imported · set-up not finished','var(--track)'], href:'01-upload.html' },
    { name:'Quiz 2 — Short Answers', term:'2026 S2', st:'complete', n:'1,203 submissions', crit:3, rubric:['Short Answer (quiz)','short-answer'], date:'closed 25 Sep', prog:[100,'released to Canvas','var(--ink-soft)'], href:'04-batch-complete.html' },
    { name:'Group Presentation', term:'2026 S2', st:'complete', n:'86 groups', crit:4, rubric:['Group Presentation','group-presentation'], date:'closed 12 Sep', prog:[100,'released to Canvas','var(--ink-soft)'], href:'04-batch-complete.html' },
    { name:'Quiz 1 — Short Answers', term:'2026 S2', st:'complete', n:'1,211 submissions', crit:3, rubric:['Short Answer (quiz)','short-answer'], date:'closed 28 Aug', prog:[100,'released to Canvas','var(--ink-soft)'], href:'04-batch-complete.html' },
    { name:'Reflective Journal', term:'2026 S1', st:'complete', n:'402 submissions', crit:3, rubric:['Reflective Journal','reflective-journal'], date:'closed 6 Jun', prog:[100,'released to Canvas','var(--ink-soft)'], href:'04-batch-complete.html' }
  ];
  var PILL = { processing:['processing','Processing'], review:['reviewing','In review'], draft:['draft','Draft'], complete:['done','Complete'], cancelled:['cancelled','Cancelled'] };
  var filter = 'all';
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function match(b){
    if (filter === 'active' && !(b.st === 'processing' || b.st === 'review')) return false;
    if (filter !== 'all' && filter !== 'active' && b.st !== filter) return false;
    var q = document.getElementById('q').value.trim().toLowerCase();
    return !q || (b.name + ' ' + b.rubric[0] + ' ' + b.term).toLowerCase().indexOf(q) >= 0;
  }
  function row(b){
    var p = PILL[b.st] || PILL.draft;
    var actions=(b.canCancel?'<button class="row-action" type="button" data-act="cancel" data-id="'+b.id+'" data-version="'+b.version+'">Terminate</button>':'')+(b.canDelete?'<button class="row-action" type="button" data-act="delete" data-id="'+b.id+'" data-version="'+b.version+'">Delete</button>':'');
    return '<div class="brow" data-href="' + b.href + '">' +
      '<div class="b-main"><div class="b-name">' + esc(b.name) + (b.home ? '<span class="on-home" title="Shown on Home">On Home</span>' : '') + '</div>' +
      '<div class="b-meta mono">' + b.n + ' · ' + b.crit + ' criteria · ' + b.date + '</div></div>' +
      '<div class="b-st"><span class="pill ' + p[0] + '"><span class="dot"></span>' + p[1] + '</span></div>' +
      '<div class="b-prog"><div class="bar"><span style="width:' + b.prog[0] + '%; background:' + b.prog[2] + '"></span></div><div class="b-ptxt">' + b.prog[1] + '</div></div>' +
      '<div class="b-rub"><span class="rub-link" data-rub="' + b.rubric[1] + '">' + esc(b.rubric[0]) + '</span></div>' +
      '<div class="batch-actions">'+actions+(actions?'':'<span class="b-go" aria-hidden="true">→</span>')+'</div></div>';
  }
  function render(){
    var counts = { all:B.length, active:0, draft:0, complete:0, cancelled:0 };
    B.forEach(function(b){ if (b.st === 'processing' || b.st === 'review') counts.active++; else if(Object.prototype.hasOwnProperty.call(counts,b.st)) counts[b.st]++; });
    document.querySelectorAll('.filters .chip').forEach(function(c){ c.querySelector('span').textContent = counts[c.dataset.f]; });
    var terms = [], html = '';
    B.forEach(function(b){ if (terms.indexOf(b.term) < 0) terms.push(b.term); });
    terms.forEach(function(t){
      var rows = B.filter(function(b){ return b.term === t && match(b); });
      if (!rows.length) return;
      html += '<section class="group"><h2>Semester ' + t.split(' ')[1].slice(1) + ', ' + t.split(' ')[0] + '<small>' + rows.length + (rows.length === 1 ? ' batch' : ' batches') + '</small></h2>' +
        '<div class="list"><div class="lhead"><span>Batch</span><span>Status</span><span>Progress</span><span>Rubric</span><span>Actions</span></div>' + rows.map(row).join('') + '</div></section>';
    });
    document.getElementById('groups').innerHTML = html;
    document.getElementById('empty').hidden = !!html;
  }
  document.getElementById('q').addEventListener('input', render);
  document.querySelectorAll('.filters .chip').forEach(function(c){
    c.addEventListener('click', function(){ document.querySelectorAll('.filters .chip').forEach(function(x){ x.classList.toggle('active', x === c); }); filter = c.dataset.f; render(); });
  });
  // Rubric name opens that rubric in the library instead of the batch
  document.getElementById('groups').addEventListener('click', function(e){
    var r = e.target.closest('.rub-link'); if (!r) return;
    e.preventDefault(); location.href = '06-rubrics.html#open=' + r.dataset.rub;
  });
  document.getElementById('groups').addEventListener('click', function(e){
    if(e.target.closest('.rub-link'))return;
    var action=e.target.closest('[data-act]');
    if(action){
      e.preventDefault();e.stopPropagation();
      var id=action.dataset.id,version=Number(action.dataset.version),isCancel=action.dataset.act==='cancel';
      var message=isCancel?'Terminate this batch? Queued work will stop and partial results will be retained.':'Delete this batch and its uploaded files permanently?';
      if(!confirm(message))return;
      action.disabled=true;action.textContent=isCancel?'Terminating…':'Deleting…';
      var task=isCancel?MarkerAPI.cancelBatch(id,version,'Terminated from batch list'):MarkerAPI.deleteBatch(id,version);
      task.then(function(){location.reload();}).catch(function(error){action.disabled=false;action.textContent=isCancel?'Terminate':'Delete';alert(error.message);});
      return;
    }
    var row=e.target.closest('.brow[data-href]');if(row)location.href=row.dataset.href;
  });
  window.BatchListUI = {
    setItems: function(items){ B = items.slice(); render(); }
  };
  render();
})();
</script>
